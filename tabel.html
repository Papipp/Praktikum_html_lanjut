<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Praktikum</title>
    <style>
        table {border-collapse: collapse; width: 100%;}
        th , td {border: 1px solid #444; padding: 8px; text-align: center;}
        thead {background: #dbeafe;}
        tfoot {background: #f3f4f6; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <h1>Jadwal Praktikum Semester Ganjil</h1>
        <table>
            <caption>Jadwal Praktikum Kelas TI-3A</caption>

            <colgroup>
                <col style="width: 15%">
                <col span="2" style="width: 25%">
                <col style="width: 35%">
            </colgroup>
            <thead>
                <tr>
                    <th scope="col" rowspan="2">Hari</th>
                    <th scope="col" colspan="2">Waktu</th>
                    <th scope="col" rowspan="2">Mata Praktikum</th>
                </tr>
                <tr>
                    <th scope="col">Mulai</th>
                    <th scope="col">Selesai</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <th scope="row" rowspan="2">Senin</th>
                    <td>08.00</td>
                    <td>09.40</td>
                    <td>Pemrograman Web Lanjut</td>
                </tr>
                <tr>
                    <td>10.00</td>
                    <td>11.40</td>
                    <td>Basis Data</td>
                </tr>
                <tr>
                    <th scope="row">Rabu</th>
                    <td>13.00</td>
                    <td>14.00</td>
                    <td>Jaringan Komputer</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3">Total Praktikum Per minggu</td>
                    <td>3 Sesi</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>
</html>

<!-- Pengamatan Pribadi -->
<!-- 1. Fungsi scope(col) dan scope(row0) buat ngasih hubungan antara induk/judul ama data di sekitar -->
<!-- 2. Sederhananya colspan gabungin kolom ke samping, kalo rowspan gabungin kolom ke bawah. -->
<!-- 3. Buat bedain kepala, isi and kaki agar rapih, ama gampang buat pahami susunan tabel juga sih -->
